<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="login-page" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
            <img src="./assets/github-logo.png" alt="" class="mx-auto mb-4">
            <h1 class="text-2xl font-bold mb-2">GitHub Issues Tracker</h1>
            <p class="text-gray-500 mb-6">Sign in to manage your issues</p>
            
            <div class="text-left mb-4">
                <label class="block text-gray-700 font-bold mb-1">Username</label>
                <input type="text" id="username" placeholder="Enter Username" class="w-full p-3 border rounded outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-indigo-600 text-xs mt-1">Default: admin</p>
            </div>

            <div class="text-left mb-4">
                <label class="block text-gray-700 font-bold mb-1">Password</label>
                <input type="password" id="password" placeholder="Enter Password" class="w-full p-3 border rounded outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-indigo-600 text-xs mt-1">Default: admin123</p>
            </div>
            
            <button id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700 transition">Sign In</button>

            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="px-3 text-gray-500 text-sm">OR</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>
            
            <div class="mt-6 p-3 bg-gray-50 rounded text-sm text-center">
                <p class="font-bold text-gray-500">Demo Credentials:</p>
                <p>User: <span class="text-blue-600">admin</span></p>
                <p>Pass: <span class="text-blue-600">admin123</span></p>
            </div>
        </div>
    </div>

    <div id="main-page" class="hidden">
        <nav class="bg-white border-b px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <img src="./assets/github-logo.png" alt="Logo" class="w-8 h-8">
                <span class="font-bold text-xl">GitHub Issue Tracker</span>
            </div>
            <div class="flex gap-2 w-full md:w-auto mt-4 md:mt-0">
                <input type="text" id="search-input" placeholder="Search issues..." class="border p-2 rounded w-full md:w-64 outline-none">
                <button id="search-btn" class="bg-blue-600 text-white px-4 py-2 rounded">+ New Issue</button>
            </div>
        </nav>
